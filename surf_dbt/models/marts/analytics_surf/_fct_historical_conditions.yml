version: 2

models:
  - name: fct_historical_conditions
    description: "Hourly historical weather and marine conditions enriched with surf spot characteristics."

    columns:
      - name: spot_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_spots')
                field: spot_id

      - name: spot_name
        tests:
          - not_null

      - name: observation_time
        tests:
          - not_null

      - name: air_temperature_c
        tests:
          - not_null

      - name: wind_speed_kmh
        tests:
          - not_null

      - name: wind_direction_deg
        tests:
          - not_null

      - name: wave_height_m
        tests:
          - not_null

      - name: wave_direction_deg
        tests:
          - not_null

      - name: wave_period_s
        tests:
          - not_null

      - name: swell_height_m
        tests:
          - not_null

      - name: swell_direction_deg
        tests:
          - not_null

      - name: swell_period_s
        tests:
          - not_null