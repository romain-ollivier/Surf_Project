version: 2

models:

  - name: int_forecast_evolution
    description: >
      Comparaison entre les prévisions météorologiques historiques
      d'Open-Meteo et les dernières prévisions disponibles, sans observations terrain
      pour chaque spot et chaque horizon de prévision.

    columns:

      - name: spot_id
        description: "Identifiant du spot de surf."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_surf_spots')
                field: spot_id

      - name: spot_name
        description: "Nom du spot de surf."
        data_tests:
          - not_null

      - name: country
        description: "Pays du spot de surf."
        data_tests:
          - not_null

      - name: region
        description: "Région ou zone géographique du spot."

      - name: observation_time
        description: >
          Date et heure UTC correspondant aux conditions prévues
          et révisées.
        data_tests:
          - not_null

      - name: forecast_horizon_days
        description: >
          Nombre de jours entre l'émission de la prévision et
          l'échéance prévue.
        data_tests:
          - not_null

      # =====================================================
      # Forecast
      # =====================================================

      - name: forecast_air_temperature_c
        description: "Température de l'air prévue en degrés Celsius."

      - name: forecast_wind_speed_kmh
        description: "Vitesse du vent prévue en km/h."

      - name: forecast_wind_direction_deg
        description: "Direction du vent prévue en degrés."

      - name: forecast_wind_gusts_kmh
        description: "Rafales de vent prévues en km/h."

      - name: forecast_precipitation_mm
        description: "Précipitations prévues en millimètres."

      - name: forecast_cloud_cover_pct
        description: "Couverture nuageuse prévue en pourcentage."

      # =====================================================
      # Latest forecast reference
      # =====================================================

      - name: latest_forecast_air_temperature_c
        description: "Température de l'air de la dernière prévision en degrés Celsius."

      - name: latest_forecast_wind_speed_kmh
        description: "Vitesse du vent de la dernière prévision en km/h."

      - name: latest_forecast_wind_direction_deg
        description: "Direction du vent de la dernière prévision en degrés."

      - name: latest_forecast_wind_gusts_kmh
        description: "Rafales de vent de la dernière prévision en km/h."

      - name: latest_forecast_precipitation_mm
        description: "Précipitations de la dernière prévision en millimètres."

      - name: latest_forecast_cloud_cover_pct
        description: "Couverture nuageuse de la dernière prévision en pourcentage."

      # =====================================================
      # Forecast revisions
      # =====================================================

      - name: temperature_revision_c
        description: >
          Écart signé (ancienne prévision moins dernière prévision) entre la température prévue et la température de la dernière prévision,
          en degrés Celsius.

      - name: temperature_absolute_revision_c
        description: >
          Valeur absolue de la révision de température,
          en degrés Celsius.

      - name: wind_speed_revision_kmh
        description: >
          Écart signé (ancienne prévision moins dernière prévision) entre la vitesse du vent prévue et de la dernière prévision,
          en km/h.

      - name: wind_speed_absolute_revision_kmh
        description: >
          Valeur absolue de la révision de vitesse du vent,
          en km/h.

      - name: wind_gusts_revision_kmh
        description: >
          Écart signé (ancienne prévision moins dernière prévision) entre les rafales prévues et de la dernière prévision,
          en km/h.

      - name: wind_gusts_absolute_revision_kmh
        description: >
          Valeur absolue de la révision de rafales,
          en km/h.

      - name: precipitation_revision_mm
        description: >
          Écart signé (ancienne prévision moins dernière prévision) entre les précipitations prévues et de la dernière prévision,
          en millimètres.

      - name: precipitation_absolute_revision_mm
        description: >
          Valeur absolue de la révision de précipitations,
          en millimètres.

      - name: cloud_cover_revision_pct
        description: >
          Écart signé (ancienne prévision moins dernière prévision) entre la couverture nuageuse prévue et de la dernière prévision,
          en points de pourcentage.

      - name: cloud_cover_absolute_revision_pct
        description: >
          Valeur absolue de la révision de couverture nuageuse,
          en points de pourcentage.